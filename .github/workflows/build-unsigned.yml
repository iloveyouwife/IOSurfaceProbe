name: Build unsigned iPhone diagnostic
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build for iPhone (no signing credentials)
        run: |
          xcodebuild -project IOSurfaceReachabilityProbe.xcodeproj -target IOSurfaceReachabilityProbe -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR="$PWD/output" build
      - name: Package as unsigned IPA
        run: |
          mkdir Payload
          cp -R output/IOSurfaceReachabilityProbe.app Payload/
          zip -q -r IOSurfaceReachabilityProbe-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: IOSurfaceReachabilityProbe-unsigned
          path: IOSurfaceReachabilityProbe-unsigned.ipa
